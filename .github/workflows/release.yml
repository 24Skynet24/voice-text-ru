name: Release

# Собирает Voice Text RU на Windows и публикует установщик + портативную
# версию в GitHub Release. Запускается при пуше тега вида v1.2.3, либо вручную
# из вкладки Actions (workflow_dispatch) для проверки сборки без публикации.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build application and installer
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File build\build.ps1 -Python $python

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VoiceTextRU\*" -DestinationPath "dist\VoiceTextRU-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voicetext-ru-windows
          path: |
            dist\installer\*.exe
            dist\VoiceTextRU-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\installer\*.exe
            dist\VoiceTextRU-portable.zip
          generate_release_notes: true
