[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetext-ru"
version = "1.0.0"
description = "Локальный текстовый редактор с распознаванием русской речи в реальном времени"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26,<3",
    "huggingface_hub>=0.24",
]

[project.gui-scripts]
voicetext-ru = "voicetext_ru.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
